<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thank You | The Solo Business AI Playbook</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,rgba(104,124,255,.18),transparent 48%),#0d1017;color:#f4f6fb;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(560px,100%);padding:42px 34px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:#141925;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.3)}.brand{font-weight:800;color:#c6ceff;letter-spacing:-.03em}.check{width:58px;height:58px;margin:28px auto 14px;display:grid;place-items:center;border-radius:50%;background:#173d32;color:#75e0b3;font-size:30px}h1{font-size:32px;line-height:1.15;letter-spacing:-.045em;margin:12px 0}.muted{color:#a7b1c2}.status{margin:22px 0;padding:14px;border-radius:12px;background:#202838;color:#d8deeb}.download{display:none;margin:18px auto 0;padding:14px 22px;border-radius:11px;background:#e9edff;color:#111522;text-decoration:none;font-weight:800}.download:hover{background:#fff}.small{font-size:13px;color:#8490a4;margin-top:25px}a{color:#c3ccff}
</style>
</head>
<body>
<main class="card">
<div class="brand">N&amp;N Digitals</div>
<div class="check">✓</div>
<h1>Thank you for your purchase!</h1>
<p class="muted">The Solo Business AI Playbook</p>
<div class="status" id="status">We're confirming your payment with Paddle. This usually takes a few seconds. Please keep this page open.</div>
<a class="download" id="download" href="#">Download Your PDF</a>
<p class="small">Need help? Contact <a href="mailto:support@nndigitals.com">support@nndigitals.com</a></p>
</main>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);
 const txn=params.get("_ptxn")||params.get("transaction_id")||"";
 const status=document.getElementById("status");
 const button=document.getElementById("download");
 if(!/^txn_[a-z0-9]+$/i.test(txn)){
  status.textContent="We couldn't find your payment reference. If your payment was completed, please contact support@nndigitals.com.";
  return;
 }
 for(let i=0;i<18;i++){
  try{
   const response=await fetch("https://payments.nndigitals.com/status?transaction_id="+encodeURIComponent(txn),{cache:"no-store"});
   const data=await response.json();
   if(data.paid){
    status.textContent="Payment confirmed. Your book is ready to download.";
    button.href="https://payments.nndigitals.com/download?transaction_id="+encodeURIComponent(txn);
    button.style.display="inline-block";
    return;
   }
  }catch(e){}
  await new Promise(resolve=>setTimeout(resolve,3000));
 }
 status.textContent="Your payment may still be processing. Refresh this page in a moment. If the download button does not appear, contact support@nndigitals.com.";
})();
</script>
</body></html>
